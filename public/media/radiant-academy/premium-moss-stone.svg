      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4.5" xChannelSelector="R" yChannelSelector="G" result="rough"/>
      <feDropShadow in="rough" dx="0" dy="7" stdDeviation="4.5" flood-color="#07100a" flood-opacity="0.82"/>
    </filter>
    <filter id="surfaceGrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.58" numOctaves="3" seed="11" result="grain"/>
      <feColorMatrix in="grain" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="soft">
        <feFuncA type="table" tableValues="0 0.16"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="soft" mode="soft-light"/>
    </filter>
    <filter id="mossDepth" x="-25%" y="-70%" width="150%" height="240%">
